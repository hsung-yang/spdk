hosts:
  initiator:
    mode: local
    repo_path: /home/user/spdk
    use_sudo: true

  target:
    mode: ssh
    ssh_host: 10.0.0.22
    ssh_user: user
    ssh_port: 22
    ssh_options:
      - StrictHostKeyChecking=no
    repo_path: /home/user/spdk
    use_sudo: true

roles:
  initiator: initiator
  target: target

paths:
  rpc_py: scripts/rpc.py
  spdk_tgt: build/bin/spdk_tgt
  spdk_nvme_passthru: build/bin/spdk_nvme_passthru

runtime:
  # Optional: forwarded as --core-mask (or --target-core-mask for vector-eval).
  # target_core_mask: "0xF"
  # Optional: subset of target_core_mask reserved for CPCS builtin compute work.
  # target_compute_core_mask: "0xC"
  # Optional: forwarded as --passthru-lcores to scenario runners.
  # initiator_passthru_lcores: "1,2,3,4"
  # Optional: forwarded as --prefill-workers for vector-eval prefill.
  # vector_prefill_workers: 4

nvmeof:
  trtype: TCP
  traddr: 10.0.0.22
  trsvcid: "4420"
  nqn: nqn.2026-03.io.spdk:cpcs-exp
  hostnqn: nqn.2026-03.io.spdk:cpcs-exp-host
  # Optional source binding for initiator-side SPDK passthru.
  # src_addr: 10.10.10.72
  # src_svcid: "0"
  # Optional defaults for scenarios that can consume pre-attached physical backends.
  # pcie_bdf: 0000:01:00.0
  # dataset_bdev: Nvme0n1
  # backing_bdev: Nvme0n2

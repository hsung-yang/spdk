hosts:
  local:
    mode: local
    repo_path: /home/user/spdk
    use_sudo: true

roles:
  initiator: local
  target: local

paths:
  rpc_py: scripts/rpc.py
  spdk_tgt: build/bin/spdk_tgt
  spdk_nvme_passthru: build/bin/spdk_nvme_passthru

runtime:
  # Optional: forwarded as --core-mask (or --target-core-mask for vector-eval).
  # target_core_mask: "0xF"
  # Optional: subset of target_core_mask reserved for CPCS builtin compute work.
  # target_compute_core_mask: "0xC"
  # Optional: forwarded as --passthru-lcores to scenario runners.
  initiator_passthru_lcores: "1"
  # Direct passthru probe defaults for realapp cpcs_* modes.
  # Keep this NSID aligned with nvmeof.dataset_bdev (Nvme0n1 -> 1).
  direct_probe_nsid: 1
  # Set this to the dataset namespace logical block size (typically 512 or 4096).
  # Use cpcs_real_nvme_cutover.py on the Linux host to auto-detect the correct value.
  direct_probe_lba_bytes: 512

nvmeof:
  trtype: TCP
  traddr: 127.0.0.1
  trsvcid: "4420"
  nqn: nqn.2026-03.io.spdk:cpcs-exp
  hostnqn: nqn.2026-03.io.spdk:cpcs-exp-host

  # Real NVMe cutover mapping
  pcie_bdf: 0000:11:00.0
  dataset_bdev: Nvme0n1
  backing_bdev: Nvme0n2
